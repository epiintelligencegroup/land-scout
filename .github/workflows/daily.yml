name: House Wholesale Daily Digest

on:
  schedule:
    # 8:00 AM ET daily (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mock_lead_count:
        description: "Leads per market (default 10)"
        required: false
        default: "10"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          MOCK_LEAD_COUNT: ${{ github.event.inputs.mock_lead_count || '10' }}
        run: python run.py

      - name: Commit updated dedup log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_properties.log
          git diff --cached --quiet || git commit -m "chore: update sent_properties.log [skip ci]"
          git push
